services:
  db:
    image: postgres:16-alpine
    container_name: prm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prm
      POSTGRES_PASSWORD: prm
      POSTGRES_DB: prm
    ports:
      - "5432:5432"
    volumes:
      - prm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prm -d prm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prm_pgdata:
